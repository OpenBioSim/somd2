  }
  const sc = s.schedule;
  const lc = $("#lever-chart");
  if (lc && sc.levers) {
    const names = Object.keys(sc.levers);
    lineChart(lc, {
      series: names.map((n, i) => ({ x: sc.lambda, y: sc.levers[n], color: colour(i, names.length), name: n })),
      xLabel: LAMBDA, yLabel: "lever value", xMin: 0, xMax: 1, vlines: s.lambda_values, legend: true,
    });
  }
  const r2 = $("#rest2-chart");
  if (r2 && sc.rest2) {
    lineChart(r2, {
      series: [{ x: sc.rest2.lambda, y: sc.rest2.scale, color: css("--accent"), points: true, title: (x, y) => `${LAMBDA} = ${fmtLambda(x)}: ${fmt(y, 3)}` }],
      xLabel: LAMBDA, yLabel: "scale factor", xMin: 0, xMax: 1,
    });
  }
}

function valueWithError(value, error) {
  if (value === null || value === undefined) return "–";
  return `${fmt(value, 2)} ± ${fmt(error, 2)}`;
}

// Use the browser's save dialog where available, otherwise ask for a name.
async function download(name, text, type) {
  if (window.showSaveFilePicker) {
    const extension = name.slice(name.lastIndexOf("."));
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description: extension.slice(1).toUpperCase(), accept: { [type]: [extension] } }],
      });
      const file = await handle.createWritable();
      await file.write(text);
      await file.close();
    } catch (e) {
      if (e.name !== "AbortError") window.alert(`Couldn't save the file: ${e.message}`);
    }
    return;
  }
  name = window.prompt("Save as", name);
  if (!name) return;
  const url = URL.createObjectURL(new Blob([text], { type }));
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function toCSV(header, rows) {
  const field = (v) => {
    let s = v === null || v === undefined ? "" : String(v);
    // Stops spreadsheets treating text, e.g. a run or ligand name, as a formula.
    if (typeof v === "string" && /^[=+\-@\t\r]/.test(s)) s = `'${s}`;
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return [header, ...rows].map((row) => row.map(field).join(",")).join("\n") + "\n";
}

function exportNetwork() {
  const d = state.networkData;
  if (!d) return;
  const header = ["ligand_a", "ligand_b", "forward (kcal/mol)", "forward error", "forward status", "reverse (kcal/mol)", "reverse error", "reverse status", "combined (kcal/mol)", "combined error", "hysteresis (kcal/mol)", "hysteresis error", "in flagged cycle", "problems"];
  const rows = d.edges.map((e) => [
    e.a, e.b,
    e.forward.value, e.forward.error, e.forward.status,
    e.reverse.value, e.reverse.error, e.reverse.status,
    e.combined.value, e.combined.error,
    e.hysteresis ? e.hysteresis.value : null, e.hysteresis ? e.hysteresis.error : null,
    e.in_flagged_cycle,
    [...e.forward.problems, ...e.reverse.problems].join("; "),
  ]);
  download("somd2-network.csv", toCSV(header, rows), "text/csv");
}

// The chosen reference for ligand free energies, saved for each network file.
function ligandReference() {
  const d = state.networkData;
  const key = `${networkKey(d)}:reference`;
  if (!state.ligandReference || state.ligandReference.key !== key) {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(key) || "null"); } catch (e) {}
    // Stored values are only trusted as a known ligand and a finite number.
    if (saved && typeof saved.ligand === "string") {
      const value = Number(saved.value);
      saved = { ligand: saved.ligand, value: Number.isFinite(value) ? value : 0 };
    } else {
      saved = null;
    }
    state.ligandReference = { key, saved };
  }
  const saved = state.ligandReference.saved;
  return saved && Object.hasOwn(d.free_energies, saved.ligand) ? saved : null;
}

function setLigandReference(reference) {
  const key = `${networkKey(state.networkData)}:reference`;
  state.ligandReference = { key, saved: reference };
  try { localStorage.setItem(key, JSON.stringify(reference)); } catch (e) {}
}

// A ligand's fitted free energy, relative to the chosen reference if it's in
// the same part of the network, or the mean otherwise.
function ligandFreeEnergy(lig, reference = ligandReference()) {
  const d = state.networkData;
  const f = d.free_energies[lig];
  if (!f) return null;
  const r = reference && d.free_energies[reference.ligand];
  if (!r || r.group !== f.group) return { value: f.value, error: f.error, relative: "the mean" };
  const matrix = d.covariance[f.group];
  const cov = (i, j) => (i >= j ? matrix[i][j] : matrix[j][i]);
  const variance = cov(f.index, f.index) + cov(r.index, r.index) - 2 * cov(f.index, r.index);
  return {
    value: f.value - r.value + (reference.value || 0),
    error: Math.sqrt(Math.max(variance, 0)),
    relative: reference.ligand,
  };
}

function exportLigands() {
  const d = state.networkData;
  if (!d) return;
  const header = ["ligand", "dG (kcal/mol)", "error (kcal/mol)", "relative to", "part of network"];
  const reference = ligandReference();
  const rows = d.ligands.filter((lig) => d.free_energies[lig]).map((lig) => {
    const f = ligandFreeEnergy(lig, reference);
    return [lig, f.value, f.error, f.relative, d.free_energies[lig].group + 1];
  });
  download("somd2-ligands.csv", toCSV(header, rows), "text/csv");
}

function exportSummary(kind) {
  if (kind === "network") return exportNetwork();
  if (kind === "ligands") return exportLigands();
  const d = state.summaryData;
  if (!d) return;
  if (kind === "json") {
    download("somd2-summary.json", JSON.stringify(d, null, 2), "application/json");
    return;
  }
  const byId = new Map(d.simulations.map((s) => [s.id, s]));
  const problems = (s) => (s ? s.problems.join("; ") : "");
  let header, rows;
  if (kind === "simulations") {
    header = ["simulation", "leg", "schedule", "repeats", "finished", "analysed", "progress (%)", "dG (kcal/mol)", "error (kcal/mol)", "problems", "runs"];
    rows = d.simulations.map((s) => [s.name, s.leg, s.schedule, s.runs.length, s.num_finished, s.num_analysed, s.progress === null ? null : Math.round(1000 * s.progress) / 10, s.free_energy, s.free_energy_error, problems(s), s.runs.map((r) => r.name).join("; ")]);
  } else if (kind === "binding") {
    header = ["system", "quantity", "value (kcal/mol)", "error (kcal/mol)", "bound", "free", "bound problems", "free problems"];
    rows = d.legs.map((l) => [l.name, l.quantity, l.value, l.error, l.bound_name, l.free_name, problems(byId.get(l.bound)), problems(byId.get(l.free))]);
  } else {
    header = ["system", "dG hydration (kcal/mol)", "error (kcal/mol)", "free", "vacuum", "free problems", "vacuum problems"];
    rows = d.hydration.map((h) => [h.name, h.value, h.error, h.free_name, h.vacuum_name, problems(byId.get(h.free)), problems(byId.get(h.vacuum))]);
  }
  download(`somd2-summary-${kind}.csv`, toCSV(header, rows), "text/csv");
}

const NETWORK_SIZE = { width: 900, height: 560, radius: 22 };

// The layout's canvas grows with the number of ligands, so they don't crowd.
function networkCanvas(n) {
  const scale = Math.max(1, Math.sqrt(n / 8));
  return { width: NETWORK_SIZE.width * scale, height: NETWORK_SIZE.height * scale };
}

// A view of the whole network, keeping the default aspect ratio.
function fitNetworkView() {
  const pos = Object.values(state.networkPositions);
  const pad = 60;
  let x0 = Math.min(...pos.map((p) => p.x)) - pad, x1 = Math.max(...pos.map((p) => p.x)) + pad;
  let y0 = Math.min(...pos.map((p) => p.y)) - pad, y1 = Math.max(...pos.map((p) => p.y)) + pad;
  const aspect = NETWORK_SIZE.width / NETWORK_SIZE.height;
  let w = Math.max(x1 - x0, 300), h = Math.max(y1 - y0, 300 / aspect);
  if (w / h > aspect) h = w / aspect; else w = h * aspect;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}

function networkKey(d) {
  return `somd2-viewer-network:${d.file}`;
}

// Simple force-directed layout: nodes repel, edges attract, and everything is
// pulled gently towards the centre. Saved positions are used as the start.
function layoutNetwork(d) {
  const { width, height } = networkCanvas(d.ligands.length);
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(networkKey(d)) || "{}"); } catch (e) {}
  if (!saved || typeof saved !== "object") saved = {};
  const pos = {};
  const n = d.ligands.length;
  const valid = (p) => p && Number.isFinite(p.x) && Number.isFinite(p.y);
  d.ligands.forEach((lig, i) => {
    pos[lig] = (Object.hasOwn(saved, lig) && valid(saved[lig]) && { x: saved[lig].x, y: saved[lig].y }) || {
      x: width / 2 + 0.35 * width * Math.cos((2 * Math.PI * i) / n),
      y: height / 2 + 0.35 * height * Math.sin((2 * Math.PI * i) / n),
    };
  });
  if (d.ligands.every((lig) => saved[lig])) return pos;

  const k = 0.8 * Math.sqrt((width * height) / Math.max(n, 1));
  for (let step = 0; step < 400; step++) {
    const temperature = 0.1 * width * (1 - step / 400);
    const shift = Object.fromEntries(d.ligands.map((lig) => [lig, { x: 0, y: 0 }]));
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = pos[d.ligands[i]], b = pos[d.ligands[j]];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.max(Math.hypot(dx, dy), 1);
        const force = (k * k) / dist;
        shift[d.ligands[i]].x += (dx / dist) * force; shift[d.ligands[i]].y += (dy / dist) * force;
        shift[d.ligands[j]].x -= (dx / dist) * force; shift[d.ligands[j]].y -= (dy / dist) * force;
      }
    }
    for (const e of d.edges) {
      const a = pos[e.a], b = pos[e.b];
      const dx = a.x - b.x, dy = a.y - b.y;
      const dist = Math.max(Math.hypot(dx, dy), 1);
      const force = (dist * dist) / k;
      shift[e.a].x -= (dx / dist) * force; shift[e.a].y -= (dy / dist) * force;
      shift[e.b].x += (dx / dist) * force; shift[e.b].y += (dy / dist) * force;
    }
    for (const lig of d.ligands) {
      const s = shift[lig];
      s.x += 0.02 * (width / 2 - pos[lig].x) * k / 10;
      s.y += 0.02 * (height / 2 - pos[lig].y) * k / 10;
      const length = Math.max(Math.hypot(s.x, s.y), 1e-9);
      const move = Math.min(length, temperature);
      pos[lig].x = Math.min(width - 40, Math.max(40, pos[lig].x + (s.x / length) * move));
      pos[lig].y = Math.min(height - 40, Math.max(40, pos[lig].y + (s.y / length) * move));
    }
  }
  return pos;
}

function statusColour(status) {
  return { finished: "var(--good)", running: "var(--info)", problem: "var(--warn)" }[status] || "var(--muted)";
}

function drawNetwork(svg) {
  const d = state.networkData;
  const pos = state.networkPositions;
  const { radius } = NETWORK_SIZE;
  const view = state.networkView;
  // Labels would overlap when zoomed far out, but still show on hover.
  const showLabels = view.w < 1.8 * NETWORK_SIZE.width;
  const statuses = ["finished", "running", "problem", "not started"];
  let html = `<defs>${statuses.map((s) => `<marker id="arrow-${s.replace(" ", "-")}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${statusColour(s)}"/></marker>`).join("")}</defs>`;
  const labels = [];
  for (const e of d.edges) {
    const a = pos[e.a], b = pos[e.b];
    if (e.in_flagged_cycle) html += `<line class="flagged-cycle" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
    const runs = [["forward", e.a, e.b], ["reverse", e.b, e.a]].filter(([dir]) => e[dir].status !== "not started");
    if (!runs.length) {
      html += `<line class="edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--muted)" stroke-dasharray="6 5"><title>${esc(e.a)} – ${esc(e.b)}: not started</title></line>`;
      continue;
    }
    for (const [dir, from, to] of runs) {
      const r = e[dir];
      const p = pos[from], q = pos[to];
      const dx = q.x - p.x, dy = q.y - p.y, length = Math.max(Math.hypot(dx, dy), 1);
      const bend = runs.length > 1 ? 28 : 0;
      const c = { x: (p.x + q.x) / 2 - (dy / length) * bend, y: (p.y + q.y) / 2 + (dx / length) * bend };
      const start = towards(p, c, radius), end = towards(q, c, radius + 3);
      const colour = e.hysteresis && e.hysteresis.flagged ? "problem" : r.status;
      const title = `${from} → ${to}: ${r.value !== null ? `${fmt(r.value, 2)} ± ${fmt(r.error, 2)} kcal/mol` : r.status}${r.problems.length ? `\n${r.problems.join("\n")}` : ""}`;
      html += `<path class="edge" d="M${start.x},${start.y} Q${c.x},${c.y} ${end.x},${end.y}" stroke="${statusColour(colour)}" marker-end="url(#arrow-${colour.replace(" ", "-")})" data-run="${r.runs.length ? r.runs[0].id : ""}"><title>${esc(title)}</title></path>`;
      if (r.value !== null && showLabels) {
        const m = { x: 0.25 * p.x + 0.5 * c.x + 0.25 * q.x, y: 0.25 * p.y + 0.5 * c.y + 0.25 * q.y };
        labels.push(`<text class="edge-label" x="${m.x}" y="${m.y - 6}" text-anchor="middle">${fmt(r.value, 2)}</text>`);
      }
    }
  }
  html += labels.join("");
  const reference = ligandReference();
  for (const lig of d.ligands) {
    const p = pos[lig];
    const f = ligandFreeEnergy(lig, reference);
    html += `<g class="node${lig === state.selectedLigand ? " selected" : ""}" data-ligand="${esc(lig)}"><circle cx="${p.x}" cy="${p.y}" r="${radius}"/><text class="node-label" x="${p.x}" y="${p.y + radius + 16}" text-anchor="middle">${esc(lig)}</text><title>${esc(lig)}${f ? `\nfitted ΔG: ${fmt(f.value, 2)} ± ${fmt(f.error, 2)} kcal/mol` : ""}</title></g>`;
  }
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  svg.dataset.labels = String(showLabels);
  svg.innerHTML = html;
}

// The run and end state whose depiction shows a ligand: in an edge a → b,
// ligand a is the λ = 0 end state and ligand b the λ = 1 end state.
function ligandSource(lig) {
  for (const e of state.networkData.edges) {
    for (const [dir, from, to] of [["forward", e.a, e.b], ["reverse", e.b, e.a]]) {
      const r = e[dir];
      if (r.runs.length && (from === lig || to === lig)) return { run: r.runs[0].id, state: from === lig ? 0 : 1 };
    }
  }
  return null;
}

function selectLigand(lig) {
  state.selectedLigand = lig;
  renderLigandPanel();
  const source = lig && ligandSource(lig);
  const done = source && state.depictions[source.run] && state.depictions[source.run].status === "done";
  if (!source || done || state.depictionsLoading[source.run]) return;
  state.depictionsLoading[source.run] = true;
  getJSON(`/api/simulation/${source.run}/depictions`).then((d) => {
    state.depictions[source.run] = d;
    if (state.selectedLigand === lig) renderLigandPanel();
  }).catch(() => {}).finally(() => { state.depictionsLoading[source.run] = false; });
}

function renderLigandPanel() {
  const panel = $("#ligand-panel");
  if (!panel) return;
  const lig = state.selectedLigand;
  const layout = panel.parentElement;
  if (!lig || !state.networkData || !state.networkData.ligands.includes(lig)) {
    panel.hidden = true;
    layout.classList.remove("with-panel");
    return;
  }
  panel.hidden = false;
  layout.classList.add("with-panel");

  let structure = `<div class="note">No runs for this ligand yet.</div>`;
  const source = ligandSource(lig);
  if (source) {
    const d = state.depictions[source.run];
    if (!d) structure = `<div class="note">Loading structure…</div>`;
    else if (d.status !== "done" || !d.molecules.length) structure = `<div class="note">${esc(d.reason || "No structure available.")}</div>`;
    else structure = `<div class="depiction">${d.molecules[0][source.state ? "svg1" : "svg0"]}</div>`;
  }

  let rows = "";
  for (const e of state.networkData.edges) {
    if (e.a !== lig && e.b !== lig) continue;
    const other = e.a === lig ? e.b : e.a;
    const sign = e.a === lig ? 1 : -1;
    const value = e.combined.value !== null ? valueWithError(sign * e.combined.value, e.combined.error) : "–";
    const runs = [...e.forward.runs, ...e.reverse.runs];
    const status = [e.forward.status, e.reverse.status].includes("problem") || (e.hysteresis && e.hysteresis.flagged) || e.in_flagged_cycle
      ? "problem"
      : e.forward.status !== "not started" ? e.forward.status : e.reverse.status;
    rows += `<tr><td>${runs.length ? `<a href="#${runs[0].id}">${esc(other)}</a>` : esc(other)}</td><td class="num">${value}</td><td class="status-${status === "problem" ? "error" : status === "finished" ? "finished" : status === "running" ? "running" : "waiting"}">${esc(status)}</td></tr>`;
  }
  const fitted = ligandFreeEnergy(lig);
  panel.innerHTML = `<div class="ligand-panel-header"><h4>${esc(lig)}</h4><button type="button" data-close-panel title="Close">×</button></div>
    ${structure}
    ${fitted ? `<div class="stats">${stat(`Fitted ΔG (relative to ${esc(fitted.relative)})`, `${valueWithError(fitted.value, fitted.error)} kcal/mol`)}</div>` : ""}
    <div class="table-wrap"><table><tr><th>To</th><th class="num">ΔΔG</th><th></th></tr>${rows}</table></div>
    <div class="note">ΔΔG in kcal/mol from ${esc(lig)} to each neighbour, combining both directions.</div>`;
  panel.querySelector("[data-close-panel]").addEventListener("click", () => {
    selectLigand(null);
    const svg = $("#network-svg");
    if (svg) drawNetwork(svg);
  });
}

function towards(point, target, distance) {
  const dx = target.x - point.x, dy = target.y - point.y, length = Math.max(Math.hypot(dx, dy), 1);
  return { x: point.x + (dx / length) * distance, y: point.y + (dy / length) * distance };
}

function renderNetworkPage() {
  // Redrawing mid-drag would replace the graph being dragged.
  if (state.networkInteracting) { state.networkRenderPending = true; return; }
  const d = state.networkData;
  const main = $("#main");
  let html = `<div class="summary-header"><img src="/logo.png" alt="SOMD2"><div><h2>Network</h2>`;
  if (d) html += `<div class="muted" title="${esc(d.file)}">${d.ligands.length} ligands, ${d.edges.length} edges${d.updating ? " · updating…" : ""}</div>`;
  html += `</div>`;
  if (d) html += `<button type="button" class="no-print" data-export="network">Download CSV</button>`;
  html += `</div>`;
  if (!d) { main.innerHTML = html + `<div class="empty">Loading…</div>`; return; }
  if (!d.ligands.length) {
    main.innerHTML = html + `<div class="empty">No edges found in ${esc(d.file)}. Edges are read one per line as 'ligand_a ligand_b', separated by spaces.</div>`;
    return;
  }

  if (!state.networkPositions || d.ligands.some((lig) => !state.networkPositions[lig])) {
    state.networkPositions = layoutNetwork(d);
    state.networkView = null;
  }
  if (!state.networkView) {
    state.networkView = fitNetworkView();
  }

  html += `<div class="sections">`;
  html += card("Graph", `<div class="network-tools no-print"><button type="button" data-zoom="in" title="Zoom in">+</button><button type="button" data-zoom="out" title="Zoom out">−</button><button type="button" data-zoom="fit" title="Show the whole network">Fit</button></div>
    <div class="network-layout"><div class="network-graph"><svg id="network-svg"></svg></div><aside id="ligand-panel" class="ligand-panel" hidden></aside></div>
    <div class="legend">
      <span><i style="background:var(--good)"></i>finished</span>
      <span><i style="background:var(--info)"></i>running</span>
      <span><i style="background:var(--warn)"></i>problem or hysteresis</span>
      <span><i style="background:var(--muted)"></i>not started</span>
      <span><i style="background:var(--bad);opacity:0.4"></i>in a cycle that doesn't close</span>
    </div>
    <div class="note">Click a ligand to see its structure and edges, or an arrow to open one of its runs. Scroll or pinch to zoom, drag the background to pan, and drag the ligands to rearrange the graph.</div>`);

  const value = (r) => (r.value !== null ? valueWithError(r.value, r.error) : `<span class="muted">${esc(r.status)}</span>`);
  let table = `<div class="table-wrap"><table><tr><th>Edge</th><th class="num">Forward</th><th class="num">Reverse</th><th class="num">Combined</th><th class="num">Hysteresis</th><th>Problems</th></tr>`;
  for (const e of d.edges) {
    const h = e.hysteresis;
    const problems = [...e.forward.problems.map((p) => `forward: ${p}`), ...e.reverse.problems.map((p) => `reverse: ${p}`)];
    if (h && h.flagged) problems.push("forward and reverse disagree");
    if (e.in_flagged_cycle) problems.push("in a cycle that doesn't close");
    table += `<tr><td>${esc(e.a)} → ${esc(e.b)}</td><td class="num">${value(e.forward)}</td><td class="num">${value(e.reverse)}</td>
      <td class="num">${e.combined.value !== null ? valueWithError(e.combined.value, e.combined.error) : "–"}</td>
      <td class="num">${h ? valueWithError(h.value, h.error) : "–"}</td>
      <td class="problems">${problems.map(esc).join("<br>")}</td></tr>`;
  }
  table += `</table></div>
    <ul class="note formulas">
      <li>ΔΔG in kcal/mol, for the edge's direction in the network file. The reverse column is for runs from the second ligand to the first.</li>
      <li>Combined: the forward and negated reverse results, weighted by their errors</li>
      <li>Hysteresis: forward + reverse, which should be zero</li>
    </ul>`;
  html += card("Edges", table);

  if (d.cycles.length) {
    let cycles = `<div class="table-wrap"><table><tr><th>Cycle</th><th class="num">Closure (kcal/mol)</th><th></th></tr>`;
    for (const c of d.cycles) {
      cycles += `<tr><td>${c.ligands.map(esc).join(" → ")} → ${esc(c.ligands[0])}</td><td class="num">${valueWithError(c.value, c.error)}</td>
        <td class="problems">${c.flagged ? "doesn't close within errors" : ""}</td></tr>`;
    }
    cycles += `</table></div><div class="note">The sum of the combined ΔΔG around each independent cycle, which should be zero. Cycles more than twice their error from zero are flagged.</div>`;
    html += card("Cycle closure", cycles);
  }

  const fitted = d.ligands.filter((lig) => d.free_energies[lig]);
  if (fitted.length) {
    const groups = new Set(fitted.map((lig) => d.free_energies[lig].group)).size;
    const reference = ligandReference();
    const options = [`<option value="">the mean</option>`]
      .concat(fitted.map((lig) => `<option value="${esc(lig)}"${reference && reference.ligand === lig ? " selected" : ""}>${esc(lig)}</option>`))
      .join("");
    let ligands = `<div class="note">Relative to <select id="ligand-reference">${options}</select>
      ${reference ? `with ΔG <input id="ligand-reference-value" type="number" step="0.01" value="${reference.value || 0}" style="width:6em"> kcal/mol` : ""}</div>
      <div class="table-wrap"><table><tr><th>Ligand</th><th class="num">ΔG (kcal/mol)</th>${groups > 1 ? "<th>Part of network</th>" : ""}</tr>`;
    for (const lig of fitted) {
      const f = ligandFreeEnergy(lig, reference);
      const mean = reference && f.relative !== reference.ligand;
      ligands += `<tr${mean ? ` class="muted" title="Relative to the mean of its part of the network, which doesn't contain ${esc(reference.ligand)}"` : ""}><td>${esc(lig)}</td><td class="num">${valueWithError(f.value, f.error)}${mean ? " (mean)" : ""}</td>${groups > 1 ? `<td>${d.free_energies[lig].group + 1}</td>` : ""}</tr>`;
    }
    ligands += `</table></div>
      <div class="note">Fitted to the combined ΔΔG of all edges by weighted least squares, relative to the mean${groups > 1 ? " of each connected part of the network" : ""}, or to a chosen ligand${groups > 1 ? " in the same part" : ""}. Ligands without results are left out.</div>
      <div class="export no-print"><a href="#" data-export="ligands">Download CSV</a></div>`;
    html += card("Ligand free energies", ligands);
  }
  html += renderExcluded(d);
  html += `</div>`;
  const typing = document.activeElement && document.activeElement.id === "ligand-reference-value" ? document.activeElement.value : null;
  main.innerHTML = html;

  const referenceSelect = $("#ligand-reference");
  if (referenceSelect) referenceSelect.addEventListener("change", (e) => {
    const previous = ligandReference();
    setLigandReference(e.target.value ? { ligand: e.target.value, value: previous ? previous.value : 0 } : null);
    renderNetworkPage();
  });
  const referenceValue = $("#ligand-reference-value");
  if (referenceValue && typing !== null) { referenceValue.value = typing; referenceValue.focus(); }
  if (referenceValue) referenceValue.addEventListener("change", (e) => {
    const value = parseFloat(e.target.value);
    setLigandReference({ ...ligandReference(), value: Number.isFinite(value) ? value : 0 });
    renderNetworkPage();
  });

  const svg = $("#network-svg");
  if (svg) {
    drawNetwork(svg);
    enableNetworkDragging(svg);
    // Also retries a structure that wasn't available last time.
    selectLigand(state.selectedLigand);
  }
}

// Zoom the view by a factor, keeping the point (cx, cy) fixed on screen.
function zoomNetwork(svg, factor, cx, cy) {
  const v = state.networkView;
  const w = Math.min(Math.max(v.w * factor, 150), 50 * NETWORK_SIZE.width);
  const scale = w / v.w;
  state.networkView = { x: cx - (cx - v.x) * scale, y: cy - (cy - v.y) * scale, w, h: v.h * scale };
  updateNetworkView(svg);
}

// Moving the view only needs the viewBox changing, unless the edge labels are
// shown or hidden.
function updateNetworkView(svg) {
  const v = state.networkView;
  if (String(v.w < 1.8 * NETWORK_SIZE.width) !== svg.dataset.labels) {
    drawNetwork(svg);
  } else {
    svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
  }
}

function enableNetworkDragging(svg) {
  // Dragging a ligand moves it, and dragging the background pans the view.
  let dragging = null;
  let panning = null;
  const point = (e) => {
    const p = svg.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  };
  let pressed = null;
  svg.addEventListener("pointerdown", (e) => {
    const node = e.target.closest(".node");
    if (node) {
      dragging = node.dataset.ligand;
      pressed = { x: e.clientX, y: e.clientY, moved: false };
    } else if (!e.target.closest("[data-run]")) {
      // Graph units per screen pixel, from the graph's actual scaling.
      const ctm = svg.getScreenCTM();
      if (!ctm || !ctm.a) return;
      panning = { x: e.clientX, y: e.clientY, view: { ...state.networkView }, scale: 1 / ctm.a };
    } else {
      return;
    }
    state.networkInteracting = true;
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", (e) => {
    if (dragging) {
      if (!pressed.moved && Math.hypot(e.clientX - pressed.x, e.clientY - pressed.y) < 4) return;
      pressed.moved = true;
      const p = point(e);
      state.networkPositions[dragging] = { x: p.x, y: p.y };
      drawNetwork(svg);
    } else if (panning) {
      state.networkView = {
        ...panning.view,
        x: panning.view.x - (e.clientX - panning.x) * panning.scale,
        y: panning.view.y - (e.clientY - panning.y) * panning.scale,
      };
      updateNetworkView(svg);
    }
  });
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const p = point(e);
    zoomNetwork(svg, Math.exp(e.deltaY * 0.0015), p.x, p.y);
  }, { passive: false });
  const tools = svg.closest(".card").querySelector(".network-tools");
  if (tools) tools.addEventListener("click", (e) => {
    const button = e.target.closest("[data-zoom]");
    if (!button) return;
    const v = state.networkView;
    if (button.dataset.zoom === "fit") {
      state.networkView = fitNetworkView();
      updateNetworkView(svg);
    } else {
      zoomNetwork(svg, button.dataset.zoom === "in" ? 1 / 1.3 : 1.3, v.x + v.w / 2, v.y + v.h / 2);
    }
  });
  const stop = () => {
    panning = null;
    state.networkInteracting = false;
    const ligand = dragging;
    dragging = null;
    if (ligand && !pressed.moved) {
      selectLigand(ligand === state.selectedLigand ? null : ligand);
      drawNetwork(svg);
    } else if (ligand) {
      try { localStorage.setItem(networkKey(state.networkData), JSON.stringify(state.networkPositions)); } catch (e) {}
    }
    // Catch up with any refresh that arrived during the drag.
    if (state.networkRenderPending) {
      state.networkRenderPending = false;
      render();
    }
  };
  svg.addEventListener("pointerup", stop);
  svg.addEventListener("pointercancel", stop);
  svg.addEventListener("click", (e) => {
    const edge = e.target.closest("[data-run]");
    if (edge && edge.dataset.run) location.hash = edge.dataset.run;
  });
}

function renderExcluded(d) {
  if (!d.excluded || !d.excluded.length) return "";
  let table = `<div class="table-wrap"><table><tr><th>Run</th><th>Problem</th></tr>`;
  for (const r of d.excluded) table += `<tr><td><a href="#${r.id}">${esc(r.name)}</a></td><td class="problems">${esc(r.reason)}</td></tr>`;
  table += `</table></div><div class="note">These runs couldn't be read, so they're left out. Details are in the viewer's log.</div>`;
  return card("Runs left out", table);
}

function renderSummaryPage() {
  const d = state.summaryData;
  const main = $("#main");
  let html = `<div class="summary-header"><img src="/logo.png" alt="SOMD2"><div><h2>Summary</h2>`;
  if (d) {
    const runs = d.simulations.reduce((n, s) => n + s.runs.length, 0);
    html += `<div class="muted">${d.simulations.length} simulation${d.simulations.length === 1 ? "" : "s"} from ${runs} run${runs === 1 ? "" : "s"}${d.updating ? " · updating…" : ""}</div>`;
  }
  html += `</div>`;
  if (d) html += `<button type="button" class="no-print" data-export="json">Download JSON</button>`;
  html += `</div>`;
  if (!d) { main.innerHTML = html + `<div class="empty">Loading…</div>`; return; }

  const byId = new Map(d.simulations.map((s) => [s.id, s]));
  const repeats = (s) => `${s.num_finished} of ${s.runs.length} finished`;
  html += `<div class="sections">`;

  if (d.legs.length) {
    let table = `<div class="table-wrap"><table><tr><th>System</th><th></th><th class="num">kcal/mol</th><th>Bound leg</th><th>Free leg</th><th>Problems</th></tr>`;
    for (const leg of d.legs) {
      const b = byId.get(leg.bound), f = byId.get(leg.free);
      const problems = [...b.problems.map((p) => `bound: ${p}`), ...f.problems.map((p) => `free: ${p}`)];
      table += `<tr><td>${esc(leg.name)}</td><td>${esc(leg.quantity)}</td>
        <td class="num">${leg.value !== null ? valueWithError(leg.value, leg.error) : `<span class="muted" title="${esc(leg.note || "")}">–</span>`}</td>
        <td>${esc(leg.bound_name)}<div class="muted">${repeats(b)}</div></td>
        <td>${esc(leg.free_name)}<div class="muted">${repeats(f)}</div></td>
        <td class="problems">${problems.map(esc).join("<br>") || ""}</td></tr>`;
    }
    table += `</table></div>`;
    table += `<ul class="note formulas">
      <li>Relative: ΔΔG = ΔG<sub>bound</sub> − ΔG<sub>free</sub></li>
      <li>Absolute: ΔG<sub>bind</sub> = ΔG<sub>free</sub> − ΔG<sub>bound</sub> − ΔG<sub>correction</sub>, for an automatically generated Boresch restraint</li>
      <li>Errors: standard error over repeats, or the MBAR error for a single run, combined in quadrature</li>
    </ul>`;
    table += `<div class="export no-print"><a href="#" data-export="binding">Download CSV</a></div>`;
    html += card("Binding free energies", table);
  }

  if (d.hydration && d.hydration.length) {
    let table = `<div class="table-wrap"><table><tr><th>System</th><th class="num">ΔG<sub>hyd</sub> (kcal/mol)</th><th>Free leg</th><th>Vacuum leg</th><th>Problems</th></tr>`;
    for (const h of d.hydration) {
      const f = byId.get(h.free), v = h.vacuum ? byId.get(h.vacuum) : null;
      const problems = [...f.problems.map((p) => `free: ${p}`), ...(v ? v.problems.map((p) => `vacuum: ${p}`) : [])];
      table += `<tr><td>${esc(h.name)}</td>
        <td class="num">${h.value !== null ? valueWithError(h.value, h.error) : `<span class="muted" title="${esc(h.note || "")}">–</span>`}</td>
        <td>${esc(h.free_name)}<div class="muted">${repeats(f)}</div></td>
        <td>${v ? `${esc(h.vacuum_name)}<div class="muted">${repeats(v)}</div>` : h.decouple ? `<span class="muted">not needed (decouple)</span>` : "–"}</td>
        <td class="problems">${problems.map(esc).join("<br>")}${h.note ? `<div>${esc(h.note)}</div>` : ""}</td></tr>`;
    }
    table += `</table></div>`;
    table += `<ul class="note formulas">
      <li>Decouple: ΔG<sub>hyd</sub> = −ΔG<sub>free</sub></li>
      <li>Annihilate: ΔG<sub>hyd</sub> = ΔG<sub>vacuum</sub> − ΔG<sub>free</sub></li>
    </ul>`;
    table += `<div class="export no-print"><a href="#" data-export="hydration">Download CSV</a></div>`;
    html += card("Hydration free energies", table);
  }

  let table = `<div class="table-wrap"><table><tr><th>Simulation</th><th>Repeats</th><th class="num">ΔG (kcal/mol)</th><th>Problems</th><th>Runs</th></tr>`;
  for (const s of d.simulations) {
    const runs = s.runs.map((r) => `<a href="#${r.id}" class="status-${r.status}" title="${esc(r.name)}: ${esc(r.status)}">${esc(r.name.slice(r.name.lastIndexOf("/") + 1))}</a>`).join("");
    const open = s.runs.length > 1 ? "Open the first repeat" : "Open this run";
    table += `<tr><td><a class="sim-link" href="#${s.runs[0].id}" title="${open}">${esc(s.name)}</a><div class="muted">${esc(s.leg)}${s.absolute ? ` · ${esc(s.schedule)}` : ""}</div></td>
      <td>${repeats(s)}${s.num_analysed < s.runs.length ? `<div class="muted">${s.num_analysed} analysed</div>` : ""}</td>
      <td class="num">${valueWithError(s.free_energy, s.free_energy_error)}</td>
      <td class="problems">${s.problems.map(esc).join("<br>")}</td>
      <td class="run-links">${runs}</td></tr>`;
  }
  table += `</table></div>`;
  table += `<div class="export no-print"><a href="#" data-export="simulations">Download CSV</a></div>`;
  html += card("Simulations", table);

  html += renderExcluded(d);

  const notes = [];
  if (d.pending) notes.push(`Identifying ${d.pending} run${d.pending === 1 ? "" : "s"}…`);
  if (d.ambiguous) notes.push(`${d.ambiguous} legs couldn't be paired, since more than one bound or free leg has matching settings.`);
  if (notes.length) html += `<div class="note">${notes.map(esc).join(" ")}</div>`;
  html += `</div>`;
  main.innerHTML = html;
}

function render() {
  if (state.printing) return;
  if (state.view === "summary") { renderSummaryPage(); return; }
  if (state.view === "network") { renderNetworkPage(); return; }
  const s = state.summary;
  const main = $("#main");
  if (!s) { main.innerHTML = `<div class="empty">No SOMD2 output found.</div>`; return; }
  const scroll = window.scrollY;
  const back = [
    state.summaryAvailable ? `<a href="#summary">Summary</a>` : "",
    state.networkAvailable ? `<a href="#network">Network</a>` : "",
  ].filter(Boolean);
  let html = back.length ? `<div class="back-links no-print">← ${back.join(" · ")}</div>` : "";
  html += `<div class="title-row"><h2>${esc(s.name)}</h2><span class="badge status-${s.status}">${esc(s.status)}</span>`;
  if (s.progress) html += `<span class="muted">${s.replica_exchange ? "Replica exchange" : "Independent windows"}</span>`;
  html += `</div><div class="path">${esc(s.path)}</div>`;
  if (!s.progress) {
    const message = s.reason || "Waiting for the simulation to write its configuration.";
    main.innerHTML = html + `<div class="empty">${esc(message)}</div>`;
    return;
  }
  html += `<div class="sections">`;
  html += renderRepeats(s);
  html += renderOverview(s);
  html += renderEndStates(s);
  html += renderFreeEnergy(s);
  html += renderRepex(s);
  html += renderWindows(s);
  html += renderComponents(s);
  html += renderSamplers(s);
  html += renderSchedule(s);
  html += renderRestraints(s);
  html += renderConfig(s);
  html += `</div>`;
  const focused = document.activeElement && document.activeElement.id === "config-filter" ? document.activeElement.selectionStart : null;
  main.innerHTML = html;
  renderCharts(s);
  applyConfigFilter();
  const repeatSelect = $("#repeat-select");
  if (repeatSelect) repeatSelect.addEventListener("change", (e) => { location.hash = e.target.value; });
  const lambdaSelect = $("#components-lambda");
  if (lambdaSelect) lambdaSelect.addEventListener("change", (e) => {
    state.componentsLambda[s.id] = parseFloat(e.target.value);
    render();
    loadComponents(s);
  });
  const filter = $("#config-filter");
  if (filter) {
    filter.addEventListener("input", (e) => { state.configFilter = e.target.value; applyConfigFilter(); });
    if (focused !== null) { filter.focus(); filter.setSelectionRange(focused, focused); }
  }
  window.scrollTo(0, scroll);
}

// ---------------------------------------------------------------- data flow

// Expand the sidebar group holding a run when it's selected.
function expandGroupOf(id) {
  const run = state.runs.find((r) => r.id === id);
  if (!run) return;
  const gid = repeatGroupOf(id);
  let parent;
  if (gid) {
    state.repeatsOpen.set(gid, true);
    parent = repeatsName(repeatGroups().get(gid)).parent;
  } else {
    parent = run.name.slice(0, Math.max(0, run.name.lastIndexOf("/")));
  }
  if (parent && state.navCollapsed.delete(parent)) saveNavCollapsed();
}

function saveNavCollapsed() {
  try { localStorage.setItem("somd2-viewer-nav-collapsed", JSON.stringify([...state.navCollapsed])); } catch (err) {}
}

async function loadRuns() {
  state.runs = await getJSON("/api/simulations");
  // The summary page reports this itself when it loads.
  if (state.view === "run") await checkSummary();
  if (!state.runs.find((r) => r.id === state.current)) {
    const fromHash = location.hash.slice(1);
    state.current = (state.runs.find((r) => r.id === fromHash) || state.runs[0] || {}).id || null;
    expandGroupOf(state.current);
  }
  renderNav();
}

function loadComponents(s) {
  if (!s.has_components) return;
  const id = s.id, lam = componentsLambda(s);
  getJSON(`/api/simulation/${id}/components/${lam.toFixed(5)}`).then((c) => {
    c.lambda = lam;
    state.components[id] = c;
    if (id === state.current && componentsLambda(state.summary) === lam) render();
  }).catch((e) => {
    if (e.offline) return;
    state.components[id] = { lambda: lam, status: "error", reason: e.message };
    if (id === state.current) render();
  });
}

// Check whether there is a summary, without analysing every run. While runs
// are still being identified, check again shortly.
async function checkSummary() {
  clearTimeout(state.summaryTimer);
  try {
    const data = await getJSON("/api/summary");
    const changed = data.available !== state.summaryAvailable || data.network !== state.networkAvailable;
    state.summaryAvailable = data.available;
    state.networkAvailable = data.network;
    if (changed) {
      renderNav();
      if (state.view === "run" && state.summary) render();
    }
    if (data.pending) state.summaryTimer = setTimeout(checkSummary, 3000);
  } catch (e) {}
}

// Requests can overlap, e.g. a poll and a refresh, so a slow response mustn't
// replace a newer one.
function isLatest(kind, seq) {
  if (seq < (state.latest[kind] || 0)) return false;
  state.latest[kind] = seq;
  return true;
}

// Whether a response differs from the last one shown, so that the page is
// only redrawn when something has changed.
function hasChanged(kind, data) {
  if (state.printing) return false;
  const text = JSON.stringify(data);
  if (state.shown[kind] === text) return false;
  state.shown[kind] = text;
  return true;
}

async function loadSummary(force = false) {
  const seq = ++state.requests;
  const data = await getJSON(`/api/summary?analyse=1${force ? "&force=1" : ""}`);
  if (state.view !== "summary" || !isLatest("summary", seq)) return;
  if (hasChanged("summary", data)) {
    state.summaryData = data;
    state.summaryAvailable = data.available;
    state.networkAvailable = data.network;
    renderNav();
    render();
  }
  clearTimeout(state.quickTimer);
  if (data.pending || data.updating) state.quickTimer = setTimeout(poll, 3000);
}

async function loadNetwork(force = false) {
  const seq = ++state.requests;
  let data;
  try {
    data = await getJSON(`/api/network?analyse=1${force ? "&force=1" : ""}`);
  } catch (e) {
    // No network file, e.g. after a restart without one, so show something else.
    if (!/^404/.test(e.message)) throw e;
    state.networkAvailable = false;
    const run = state.current || (state.runs[0] && state.runs[0].id) || "";
    location.replace(state.summaryAvailable ? "#summary" : `#${run}`);
    return;
  }
  if (state.view !== "network" || !isLatest("network", seq)) return;
  if (hasChanged("network", data)) {
    state.networkData = data;
    state.summaryAvailable = data.available;
    state.networkAvailable = true;
    renderNav();
    render();
  }
  clearTimeout(state.quickTimer);
  if (data.pending || data.updating) state.quickTimer = setTimeout(poll, 3000);
}

async function loadCurrent(force = false) {
  if (state.view === "summary") return loadSummary(force);
  if (state.view === "network") return loadNetwork(force);
  if (!state.current) { state.summary = null; render(); return; }
  const id = state.current;
  const seq = ++state.requests;
  const gid = repeatGroupOf(id);
  const [summary, group] = await Promise.all([
    getJSON(`/api/simulation/${id}`),
    gid ? getJSON(`/api/group/${encodeURIComponent(gid)}?analyse=1${force ? "&force=1" : ""}`) : null,
  ]);
  if (id !== state.current || state.view !== "run" || !isLatest("run", seq)) return;
  state.summary = summary;
  state.group = group;
  const runChanged = hasChanged("run", summary);
  const groupChanged = hasChanged("group", group);
  if (runChanged || groupChanged) render();
  loadComponents(summary);
  let pending = summary.status === "waiting" || (summary.progress && !summary.windows.length);
  if (summary.analysis && (summary.analysis.status === "pending" || summary.analysis.updating)) pending = true;
  if (group && group.runs.some((r) => r.updating)) pending = true;
  // Depictions are fetched once, then again on the normal refresh until they
  // succeed, and only one request is in flight at a time.
  const depiction = state.depictions[id];
  if (summary.progress && !state.depictionsLoading[id] && (!depiction || depiction.status !== "done")) {
    if (!depiction) pending = true;
    state.depictionsLoading[id] = true;
    getJSON(`/api/simulation/${id}/depictions`).then((d) => {
      state.depictions[id] = d;
      if (id === state.current) render();
    }).catch(() => {}).finally(() => { state.depictionsLoading[id] = false; });
  }
  // Check again shortly while a run is starting up or an analysis is running.
  clearTimeout(state.quickTimer);
  if (pending) state.quickTimer = setTimeout(poll, 3000);
}

// Problems are kept by kind, so that a successful version check doesn't hide
// an error from loading the page.
function showProblem(kind, message) {
  if (message) state.problems[kind] = message;
  else delete state.problems[kind];
  document.body.classList.toggle("disconnected", Boolean(state.problems.offline));
  let banner = $("#offline");
  const text = Object.values(state.problems).join(" ");
  if (!text) { if (banner) banner.remove(); return; }
  if (!banner) {
    $("#main").insertAdjacentHTML("afterbegin", `<div id="offline" class="card" style="margin-bottom:12px;color:var(--bad)"></div>`);
    banner = $("#offline");
  }
  banner.textContent = text;
}

function showError(e) {
  const message = e.message.replace(/\.+$/, "");
  if (e.offline) {
    showProblem("offline", `Couldn't reach the viewer server: ${message}. The results shown may be out of date.`);
  } else if (e.conflict) {
    showProblem("offline", null);
    showProblem("error", `${message}.`);
  } else if (e.status) {
    showProblem("offline", null);
    showProblem("error", `The viewer server reported an error: ${message}. Details are in the viewer's log.`);
  } else {
    console.error(e);
    showProblem("offline", null);
    showProblem("error", `Something went wrong showing this page: ${message}. Details are in the browser's console.`);
  }
}

async function refresh(force = false) {
  try {
    await loadRuns();
    await loadCurrent(force);
    showProblem("offline", null);
    showProblem("error", null);
  } catch (e) {
    showError(e);
  }
}

async function poll() {
  try {
    await loadCurrent();
    showProblem("offline", null);
    showProblem("error", null);
  } catch (e) {
    showError(e);
  }
}

// Reload the page when the server is restarted or the page changes.
async function checkVersion() {
  // Checks would otherwise pile up while the server is busy.
  if (state.checkingVersion) return;
  state.checkingVersion = true;
  try {
    const { version } = await getJSON("/api/version");
    if (state.version === undefined) state.version = version;
    else if (version !== state.version && !state.printing) {
      console.info("Reloading, since the viewer has changed.");
      reload();
    }
    showProblem("offline", null);
  } catch (e) {
    if (e.offline) showError(e);
  } finally {
    state.checkingVersion = false;
  }
}

function schedule() {
  clearInterval(state.timer);
  const seconds = parseInt($("#interval").value, 10);
  if (seconds > 0) state.timer = setInterval(() => refresh(), seconds * 1000);
}

window.addEventListener("hashchange", () => {
  const target = location.hash.slice(1);
  // The new view hasn't been drawn yet, whatever was last shown.
  state.shown = {};
  if (target === "summary" || target === "network") {
    state.view = target;
  } else {
    state.view = "run";
    // Only known runs are requested, whatever is typed in the address bar.
    if (state.runs.some((r) => r.id === target)) state.current = target;
    expandGroupOf(state.current);
  }
  renderNav();
  const active = $("#nav a.active");
  if (active) active.scrollIntoView({ block: "nearest" });
  poll();
});
$("#interval").addEventListener("change", schedule);
$("#refresh").addEventListener("click", () => refresh(true));
$("#print").addEventListener("click", () => window.print());
// Let a viewer whose simulation has ended stop soon after its last page closes.
window.addEventListener("pagehide", () => {
  try { navigator.sendBeacon("/api/closed"); } catch (e) {}
});
// Expand the details within open sections when printing, and don't re-render
// until it's done. Collapsed sections are left out.
window.addEventListener("beforeprint", () => {
  state.printing = true;
  document.querySelectorAll("details.section[open] details").forEach((d) => {
    d.dataset.wasOpen = d.open ? "1" : "";
    d.open = true;
  });
  document.querySelectorAll("#config-table tr").forEach((tr) => { tr.hidden = false; });
});
window.addEventListener("afterprint", () => {
  state.printing = false;
  render();
});
// Remember which groups of runs are collapsed in the sidebar.
$("#nav").addEventListener("toggle", (e) => {
  if (e.target.matches && e.target.matches("details.nav-repeats")) {
    state.repeatsOpen.set(e.target.dataset.repeats, e.target.open);
    return;
  }
  const group = e.target.matches && e.target.matches("details.nav-group") ? e.target : null;
  if (!group) return;
  const name = group.dataset.group;
  if (group.open !== state.navCollapsed.has(name)) return;
  if (group.open) state.navCollapsed.delete(name);
  else state.navCollapsed.add(name);
  saveNavCollapsed();
}, true);
// Remember which sections are collapsed, and redraw charts in a section that
// is opened, since they can't be sized while hidden.
$("#main").addEventListener("click", (e) => {
  const repeat = e.target.closest("[data-repeat]");
  if (repeat) { location.hash = repeat.dataset.repeat; return; }
  const target = e.target.closest("[data-export]");
  if (!target) return;
  e.preventDefault();
  exportSummary(target.dataset.export);
});
$("#main").addEventListener("toggle", (e) => {
  const section = e.target.matches && e.target.matches("details.section") ? e.target : null;
  if (!section || state.printing) return;
  const name = section.dataset.section;
  if (section.open !== state.collapsed.has(name)) return;
  if (section.open) state.collapsed.delete(name);
  else state.collapsed.add(name);
  try { localStorage.setItem("somd2-viewer-collapsed", JSON.stringify([...state.collapsed])); } catch (err) {}
  if (section.open && state.summary) renderCharts(state.summary);
}, true);
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => state.summary && renderCharts(state.summary), 150);
});

// Show which directories this viewer is serving, with the full paths on hover.
getJSON("/api/paths").then((paths) => {
  const names = paths.map((p) => p.split("/").filter(Boolean).pop() || p);
  const shown = names.length > 3 ? `${names.slice(0, 2).join(", ")} + ${names.length - 2} more` : names.join(", ");
  const el = $("#viewing");
  el.textContent = `Viewing: ${shown}`;
  el.title = paths.join("\n");
}).catch(() => {});
checkVersion();
setInterval(checkVersion, 3000);
// Timers are throttled in background tabs, so check as soon as the page is seen.
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
window.addEventListener("pageshow", (e) => { if (e.persisted) checkVersion(); });
refresh();
schedule();
</script>
</body>
</html>
